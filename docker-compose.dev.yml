version: '3.8'

services:
  dotnet-deploy-notify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnet-deploy-notify
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - .:/app:ro
      - ./src:/app/src:ro
    restart: unless-stopped
    networks:
      - deploy-notify-network

networks:
  deploy-notify-network:
    driver: bridge