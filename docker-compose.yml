version: '3.8'

services:
  dotnet-deploy-notify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnet-deploy-notify
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - deploy-notify-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - deploy-notify-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: deploy-notify
      POSTGRES_USER: deployuser
      POSTGRES_PASSWORD: deploypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - deploy-notify-network

volumes:
  postgres_data:

networks:
  deploy-notify-network:
    driver: bridge