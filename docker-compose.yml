version: '3.8'

services:
  dotnet-deploy-notify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnet-deploy-notify
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - deploy-notify-network

networks:
  deploy-notify-network:
    driver: bridge
